dedication: |
  For everyone, who didn't have someone, to help them understand.

acknowledgements: |
  I can't really not start out by thanking my family. My kids, and partner Gemma, who have put up with
  a lot of late-night scribbling in notebooks, staring at screens, raging at the world, and generally being
  a bit of a pain in the ass.

  In addition, I'd like to thank all the lovely people I've worked with over the years, and all the people
  I look forward to working with in the future. Over time, I've tried to say it as plainly as I possibly could,
  and as straightly as I could, that I appreciate you, and everything you've done.

