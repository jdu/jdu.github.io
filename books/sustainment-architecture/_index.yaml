parts:
  - title: Welcome
    summary: |
      This is a book about a lot of things. But at the heart of it, it's a
      culmination of decades of working within organisations that have a huge,
      wide, varied, and constantly changing remit that doesn't always align
      with the needs of the people who work within them.

    chapters:
      - 000_001.adoc
