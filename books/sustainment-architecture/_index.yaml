  - title: Recovering a lost function
    summary: |
      Everything so far assumes a reader with some capacity to act. Most
      organisations picking up this book don't have that yet, they have an
      engineering function that's already exhausted, already distrusted, and
      already carrying the accumulated weight of every chapter in Part IV. This
      Part is about that starting condition specifically.
