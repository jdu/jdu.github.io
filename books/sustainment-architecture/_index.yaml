  - title: Teams
    summary: |
      Chapter 17 was about where team boundaries should sit. This Part is about
      how teams actually form and change once boundaries exist. Valve's employee
      handbook, one of the few management documents ever made fully public, is
      the clearest working example of the ideas below, and it's worth reading in
      full alongside this Part.
